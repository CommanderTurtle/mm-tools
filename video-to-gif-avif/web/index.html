<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Forge</title><link rel="stylesheet" href="/assets/app.css?v=webm1"></head>
<body>
  <header><div class="brand"><b>MOTION FORGE</b><span>VIDEO → GIF / ANIMATED AVIF / WEBM</span></div><div id="runtime" class="runtime">Inspecting local encoders…</div></header>
  <main>
    <section class="stage panel">
      <label id="drop" class="drop"><input id="file" type="file" accept="video/*" hidden><b>Choose or drop a video</b><span>MP4 · WebM · MOV · MKV · anything FFmpeg reads</span></label>
      <video id="source" controls playsinline></video>
      <div id="source-meta" class="muted">No source selected.</div>
      <div class="timeline"><label>Start<input id="start" type="number" min="0" step="0.01" value="0"></label><button id="use-start">Use playhead</button><label>End <small>(0 = full)</small><input id="end" type="number" min="0" step="0.01" value="0"></label><button id="use-end">Use playhead</button></div>
    </section>

    <section class="editor panel">
      <div class="tabs"><button class="active" data-format="gif">GIF</button><button data-format="avif">Animated AVIF</button><button data-format="webm">WebM + sound</button></div>
      <div class="grid basic">
        <label>Output width<input id="width" type="number" min="0" max="16384" value="640"><small>0 preserves source; 3840 is valid.</small></label>
        <label>Frames / second<input id="fps" type="number" min="1" max="120" step="1" value="15"></label>
        <label>Playback speed<select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="4">4×</option></select></label>
        <label>Loops<input id="loop" type="number" min="0" max="65535" value="0"><small>0 = forever</small></label>
      </div>
      <div id="gif-options" class="format-options">
        <h2>GIF palette</h2>
        <div class="grid four">
          <label>Colors<input id="gif-colors" type="number" min="2" max="256" value="256"></label>
          <label>Dithering<select id="gif-dither"><option value="sierra2_4a">Sierra Lite · balanced</option><option value="floyd_steinberg">Floyd–Steinberg</option><option value="bayer">Bayer · crisp</option><option value="atkinson">Atkinson</option><option value="none">None</option></select></label>
          <label>Palette analysis<select id="gif-palette"><option value="diff">Motion regions</option><option value="full">Whole clip</option><option value="single">Per-frame</option></select></label>
          <label>Alpha cutoff<input id="gif-alpha" type="number" min="0" max="255" value="128"></label>
          <label>Processing<select id="gif-engine"><option value="cpu">CPU · universal</option><option value="cuda">RTX-assisted · decode + resize</option></select><small>Palette creation and GIF encoding remain CPU operations.</small></label>
        </div>
      </div>

      <div id="avif-options" class="format-options hidden">
        <h2>AVIF quality</h2>
        <div class="grid four">
          <label>Quality <output id="quality-out">78</output><input id="avif-quality" type="range" min="0" max="100" value="78"></label>
          <label>Encoder<select id="avif-engine"><option value="software">libaom · smallest</option><option value="nvenc">RTX 5090 · fast</option></select></label>
          <label>Software effort<select id="avif-effort"><option value="8">8 · fastest</option><option value="6" selected>6 · balanced</option><option value="4">4 · thorough</option><option value="2">2 · very slow</option><option value="0">0 · exhaustive</option></select></label>
          <label class="check"><input id="avif-10bit" type="checkbox"> 10-bit color</label>
        </div>
      </div>

      <div id="webm-options" class="format-options hidden">
        <h2>WebM video</h2>
        <div class="grid four">
          <label>Quality <output id="webm-quality-out">78</output><input id="webm-quality" type="range" min="0" max="100" value="78"></label>
          <label>Encoder<select id="webm-engine"><option value="nvenc">RTX 5090 · AV1 NVENC</option><option value="software">VP9 software</option></select></label>
          <label class="check"><input id="webm-audio" type="checkbox" checked> Keep source audio</label>
        </div>
      </div>

      <details><summary>Crop, rotate, and flip</summary>
        <div class="grid four">
          <label>Crop X<input id="crop-x" type="number" min="0" value="0"></label><label>Crop Y<input id="crop-y" type="number" min="0" value="0"></label>
          <label>Crop width<input id="crop-width" type="number" min="0" value="0"></label><label>Crop height<input id="crop-height" type="number" min="0" value="0"></label>
          <label>Rotate<select id="rotate"><option value="none">None</option><option value="cw">90° clockwise</option><option value="ccw">90° counter-clockwise</option><option value="180">180°</option></select></label>
          <label>Flip<select id="flip"><option value="none">None</option><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="both">Both</option></select></label>
        </div>
      </details>
      <div class="actions"><button id="stop" class="secondary" disabled>Stop</button><button id="run" disabled>Convert locally</button></div>
    </section>

    <section class="result panel">
      <div class="result-head"><div><h2>Result</h2><p id="status">Waiting for a video.</p></div><div class="downloads"><a id="download" class="download disabled">Download</a></div></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="stats"><div><span>Source</span><b id="before">—</b></div><div><span>Output</span><b id="after">—</b></div><div><span>Dimensions</span><b id="dimensions">—</b></div><div><span>FPS</span><b id="actual-fps">—</b></div></div>
      <img id="preview" alt="Converted animation">
      <video id="video-preview" controls loop playsinline></video>
      <details class="logs"><summary>FFmpeg output</summary><pre id="log">No job output.</pre></details>
    </section>
  </main>
  <script src="/assets/app.js?v=webm1" defer></script>
</body></html>
