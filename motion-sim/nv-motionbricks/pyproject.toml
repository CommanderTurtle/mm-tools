[build-system]
requires = ["setuptools >= 77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motionbricks"
dynamic = ["version"]
requires-python = ">=3.12"

dependencies = [
    "newton==1.6.0",
    "warp-lang>=1.17.0",
    "pyglet==2.1.13",
    "numpy==2.4.3",
    "trimesh>=4.6.8",
    "imgui-bundle==1.92.4",
    "pillow>=13.0.0",
    "usd-core==26.3",
    "scipy==1.17.1",
    "tensorrt-cu12==10.8.0.43",
    "tensorrt-cu12-bindings==10.8.0.43",
    "tensorrt-cu12-libs==10.8.0.43",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["motionbricks*"]
exclude = ["app*", "assets*"]

[tool.setuptools.package-data]
motionbricks = ["assets/**/*"]

[tool.setuptools.dynamic]
version = { attr = "motionbricks.__version__" }

[tool.uv]
managed = true
