# FAB-L body run: one run of 40,000 steps (batch 8 per process; the released run used 4 processes), AdamW,
# lr 5e-4 (decoder 2e-5, backbone 5e-5), 500 warm-up steps then cosine, EMA 0.9998, 512 px crops, the 2.5D lift
# ramped in over the first 5,000 steps. The released mix of pools (with their @N repeats) is listed in docs/training.md;
# pools below is a placeholder for your own.
#
# Released recipe (the saved arguments of the released run). Every key is a train/train_fab.py argument;
# command-line arguments override. ${FAB_DATA} defaults to $FAB_HOME/data; "auto" paths resolve under $FAB_HOME
# (bm_dir: body_models/, foot_reg: extras/mhr23_regressor.npz). Label sidecar names are documented in docs/training.md.

