gt2d_crop_tars: ""
gt2d_gate: "image"
gt2d_in_crop: false
gt_fix_alias: ""
gt_fix_labels: ""
gt_fix_min_deg: 0.0
gt_fix_tars: ""
hard_gamma: 1.0
heel2d_vertex: ""
