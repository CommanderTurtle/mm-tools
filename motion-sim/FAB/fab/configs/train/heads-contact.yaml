# FAB-L contact head on the frozen FAB-L body (pass --init <body model.pt>): 4,000 steps, batch 64.
# Released recipe (the saved arguments of the released run). Every key is a train/train_fab.py argument;
# command-line arguments override. ${FAB_DATA} defaults to $FAB_HOME/data; "auto" paths resolve under $FAB_HOME
# (bm_dir: body_models/, foot_reg: extras/mhr23_regressor.npz). Label sidecar names are documented in docs/training.md.

