<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RMBG · Matte desk</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#151619;color:#edece5}*{box-sizing:border-box}body{max-width:1480px;margin:auto;padding:clamp(14px,3vw,44px)}header,nav,.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid #414242;padding-bottom:1em}h1{margin:0;font:500 clamp(28px,5vw,48px)/1.1 Georgia}small,output{font:13px ui-monospace,monospace;color:#c9c4ad}main{display:grid;grid-template-columns:minmax(200px,290px) 1fr;gap:24px;margin-top:20px}aside>*{display:block;margin-bottom:14px}label,input,button,select,a{font:inherit}button,a,input:not([type=range]),select{color:inherit;background:#292a2b;border:1px solid #505154;border-radius:6px;padding:.48em .7em}button,a{cursor:pointer;text-decoration:none}button:disabled{opacity:.5}button.primary{background:#efc978;color:#211d15;border-color:transparent}#drop{padding:22px 12px;background:#202225;border:1px dashed #888;border-radius:10px}#drop.over{border-color:#ffe0a2}input[type=file]{width:100%}input[type=url]{max-width:100%}input[type=number]{width:6em}article{min-width:0}#surface{position:relative;overflow:hidden;min-height:180px;background-color:#9fa2a1;background-image:repeating-conic-gradient(#c1c2bc 0% 25%,transparent 0% 50%);background-size:20px 20px;border:1px solid #45474c;border-radius:8px}#surface img{width:100%;display:block;transform-origin:var(--focus,50% 50%);scale:var(--zoom,1)}#wipe{position:absolute;inset:0;pointer-events:none}#surface:empty{height:52vh}#samples{display:flex;flex-wrap:wrap;gap:5px}#samples img{height:43px;max-width:65px;object-fit:contain}output{display:block;padding:.8em 0}nav{margin-bottom:10px}.bar{padding:12px 0}[hidden]{display:none!important}@media(max-width:730px){main{grid-template-columns:1fr}}
</style><header><h1>Matte desk</h1><small>BRIA / RMBG 3.0</small></header><main><aside>
<label id="drop">Drop or paste images<input id="files" type="file" accept="image/*" multiple></label>
<div class="row"><input id="url" type="url" placeholder="Image URL (CORS)" aria-label="Image URL"><button id="fetch">Import URL</button></div>
<button id="example">Load sample</button><label><input id="preserve" type="checkbox" checked> Preserve input transparency</label><label>Seed <input type="number" id="seed" min="0" max="4294967295" value="0"></label>
<button id="go" class="primary">Remove background</button><button id="reset">Clear</button><div id="samples"></div><output id="status" role="status">Choose an image to begin.</output></aside>
<article><nav><label>View <select id="view"><option>Compare</option><option>Cutout</option><option>Matte</option><option>Original</option></select></label><label>Backdrop <input id="color" type="color" value="#dad3b9"></label><button id="grid">Checker</button><label>Zoom <input id="zoom" type="range" min="1" max="4" step=".1" value="1"></label></nav>
<div id="surface"><img id="after" alt="Image inspection"><div id="wipe"><img id="before" alt="Original image" hidden></div></div><div class="row bar"><label id="divider" hidden>Compare <input type="range" id="split" value="50"></label><button id="png" disabled>Cutout PNG ↓</button><button id="mask" disabled>Matte PNG ↓</button></div></article></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let rows=[],at=-1,running=false;
function show(i){at=i;const r=rows[i];$('before').hidden=true;$('divider').hidden=true;$('png').disabled=$('mask').disabled=!r?.out;
if(!r){$('after').removeAttribute('src');$('before').removeAttribute('src');return}
let v=$('view').value;$('after').src=v==='Original'||!r.out?r.src:v==='Matte'?r.matte:r.out;
if(v==='Compare'&&r.out){$('before').src=r.src;$('before').hidden=$('divider').hidden=false;$('split').oninput()}
$('status').textContent=r.name+' · '+(r.note||(r.out?'Done':'Ready'))}
function gallery(){$('samples').replaceChildren(...rows.map((r,i)=>{let b=document.createElement('button'),im=new Image();im.src=r.out||r.src;im.alt=b.title=r.name;b.append(im);b.onclick=()=>show(i);return b}))}
function add(blobs){for(const blob of blobs){if(blob.type&&!blob.type.startsWith('image/'))continue;rows.push({file:blob,name:blob.name||'image',src:URL.createObjectURL(blob)})}gallery();show(rows.length-1)}
$('files').onchange=e=>add(e.target.files);$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};$('drop').ondragleave=()=>$('drop').classList.remove('over');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');add(e.dataTransfer.files)};document.onpaste=e=>add([...e.clipboardData.files]);
async function load(url){try{const res=await fetch(url,{credentials:'omit'});if(!res.ok)throw Error('HTTP '+res.status);const f=await res.blob();if(!f.type.startsWith('image/'))throw Error('URL did not return an image');add([f])}catch(e){$('status').textContent=e.message+' · You can also upload the image.'}}
$('example').onclick=()=>load('/example');$('fetch').onclick=()=>{try{const u=new URL($('url').value);if(!['https:','http:'].includes(u.protocol))throw Error();load(u.href)}catch{$('status').textContent='Enter an HTTP image URL.'}};
$('split').oninput=()=>$('wipe').style.clipPath='inset(0 '+(100-$('split').value)+'% 0 0)';
$('view').oninput=()=>show(at);$('color').oninput=()=>$('surface').style.background=$('color').value;$('grid').onclick=()=>$('surface').style.background='';
$('zoom').oninput=()=>$('surface').style.setProperty('--zoom',$('zoom').value);$('surface').onpointermove=e=>{const r=e.currentTarget.getBoundingClientRect();e.currentTarget.style.setProperty('--focus',((e.clientX-r.x)*100/r.width)+'% '+((e.clientY-r.y)*100/r.height)+'%')};
async function alpha(blob){const im=await createImageBitmap(blob);const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);im.close();const px=g.getImageData(0,0,c.width,c.height),a=px.data;for(let i=0;i<a.length;i+=4){a[i]=a[i+1]=a[i+2]=a[i+3];a[i+3]=255}g.putImageData(px,0,0);return URL.createObjectURL(await new Promise(ok=>c.toBlob(ok,'image/png')))}
$('go').onclick=async()=>{if(running||at<0)return;running=true;$('go').disabled=$('reset').disabled=true;
const todo=rows.filter(r=>!r.out);if(!todo.length)todo.push(rows[at]);const seed=$('seed').value,keep=$('preserve').checked;
try{for(let i=0;i<todo.length;i++){const r=todo[i];show(rows.indexOf(r));$('status').textContent='Separating '+(i+1)+' / '+todo.length+' · '+r.name;
const fd=new FormData();fd.set('photo',r.file,'source');fd.set('seed',seed);fd.set('preserve',keep);
try{const res=await fetch('/matte',{method:'POST',body:fd});if(!res.ok){const err=await res.text();try{throw Error(JSON.parse(err).detail)}catch(e){throw Error(e instanceof SyntaxError?err:e.message)}}const blob=await res.blob(),mask=await alpha(blob);
if(r.out){URL.revokeObjectURL(r.out);URL.revokeObjectURL(r.matte)}r.out=URL.createObjectURL(blob);r.matte=mask;r.note='Done · seed '+seed}catch(e){r.note=e.message}
gallery();show(rows.indexOf(r))}}finally{running=false;$('go').disabled=$('reset').disabled=false}}
$('reset').onclick=()=>{for(const r of rows)for(const u of [r.src,r.out,r.matte])if(u)URL.revokeObjectURL(u);rows=[];gallery();show(-1);$('files').value='';$('status').textContent='Choose an image to begin.'};
for(const [id,k] of [['png','out'],['mask','matte']])$(id).onclick=()=>{const r=rows[at];if(!r?.[k])return;const a=document.createElement('a');a.href=r[k];a.download=r.name.replace(/\.[^.]+$/,'')+'-'+k+'.png';a.click()};
</script></html>
