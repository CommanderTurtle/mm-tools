<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WeMM · Screening room</title>
<style>:root{color-scheme:dark;background:#111916;color:#edf3eb;font:15px/1.45 system-ui}*{box-sizing:border-box}body{margin:auto;max-width:1550px;padding:clamp(14px,3vw,42px)}header,nav,.row{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}header{justify-content:space-between;border-bottom:1px solid #405348;padding-bottom:12px}h1{font:500 clamp(28px,4vw,46px)/1 Georgia;margin:.25em 0}small,summary,label,output{font:13px ui-monospace,monospace}small,output{color:#becdbb}main{display:grid;grid-template-columns:minmax(280px,1.15fr) minmax(300px,1fr);gap:clamp(15px,3vw,40px);margin-top:22px}article,aside{min-width:0}button,input,textarea,select{font:inherit;color:inherit;background:#24332b;border:1px solid #4b6051;border-radius:6px;padding:.45rem .7rem}button{cursor:pointer}button.primary{background:#b1dfaa;color:#152314;font-weight:650}button:disabled{opacity:.5}input[type=number]{width:6em}textarea{width:100%;min-height:6em;resize:vertical;margin:12px 0}label{display:inline-block;padding:.25em}#screen{display:grid;place-items:center;aspect-ratio:16/10;background:#080e0b;border:1px solid #405345;border-radius:9px;overflow:hidden}#screen :is(video,img,audio){max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}#screen audio{height:70px}.bar{margin:12px 0}#rack{list-style:none;padding:0}#rack li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}#rack button[aria-current=true]{border-color:#b3e2ac}output{display:block;margin:.7em 0}#log{max-height:65vh;overflow:auto}.reply{border-left:2px solid #57715d;padding:0 0 0 14px;margin:12px 0 20px}.reply p,.reply pre{white-space:pre-wrap;overflow-wrap:anywhere}.reply .question{font-weight:650}.reply pre{font-size:.9rem;color:#b0c5ad}.stamp{border:0;padding:0;color:#b4e4a2;background:none;text-decoration:underline;font:inherit}hr{border:0;border-top:1px solid #38483d}details{margin:.7em 0}details>summary{cursor:pointer}#help{min-height:2em}#drop{border:1px dashed #718775;padding:.6em}.error{color:#ffb59c}@media(max-width:760px){main{grid-template-columns:1fr}#log{max-height:none}}</style>
<header><div><small>WeMM / 35B-A3B · AWQ</small><h1>Screening room</h1></div><output id="engine" role="status">Connecting…</output></header><main><aside>
<div id="screen"><small>Choose a clip, recording or still</small></div>
<div class="row bar"><label id="drop">Add media <input type="file" id="file" multiple accept="video/*,audio/*,image/*"></label></div>
<nav>Samples <button data-ex="movie">Moon landing</button><button data-ex="audio">Radio call</button><button data-ex="image">Earth</button></nav>
<ul id="rack"></ul><details><summary>Sampling &amp; context</summary><label><input type="checkbox" checked id="sound"> Use video soundtrack</label><label>FPS <input id="fps" type="number" min=".1" max="8" step=".1" value="1"></label><label>Frame cap <input type="number" min="4" max="256" value="16" id="frames"></label><label>Reply tokens <input type="number" min="32" max="8192" value="1024" id="tokens"></label></details></aside>
<article><div class="row"><select id="preset" aria-label="Question templates"><option value="">Question templates…</option><option>Describe the scene in time order. Attribute each line to its speaker and give timestamps.</option><option>Break down the play: match actions on screen to the commentary and give timestamps.</option><option>区分主播和其他说话人，按时间列出展示的商品以及介绍内容。</option><option>Compare both clips. Where do their images or soundtracks differ?</option><option>Transcribe the recording in its original language and mark speaker changes.</option></select></div>
<textarea id="q" aria-label="Question" placeholder="Ask about this footage…"></textarea><div class="row"><button class="primary" id="ask" disabled>Ask</button><button id="stop" disabled>Stop</button><label><input type="checkbox" id="think"> Thinking</label><button id="new">New conversation</button><button id="save">Save notes</button></div>
<output id="help" role="status"></output><hr><div id="log" aria-live="polite"></div></article></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let sid='',items=[],selected=null,busy=false,ready=false,uploads=0,abort=null,turns=[];
const head=()=>({'X-Session':sid});
function controls(){$('ask').disabled=!ready||busy||uploads>0||!sid;$('stop').disabled=!busy;$('new').disabled=busy||uploads>0}
function tell(s){$('help').textContent=s}
async function checked(p){const r=await p;if(!r.ok){const s=await r.text();let e;try{e=JSON.parse(s).detail}catch{}throw Error(e||s||('HTTP '+r.status))}return r}
async function start(){if(sid)await checked(fetch('/session',{method:'DELETE',headers:head()})).catch(e=>{if(!e.message.includes('expired'))throw e});
const r=await checked(fetch('/session',{method:'POST'}));sid=(await r.json()).session;for(const i of items)if(i.url.startsWith('blob:'))URL.revokeObjectURL(i.url);
items=[];selected=null;turns=[];$('rack').replaceChildren();$('screen').textContent='Choose a clip, recording or still';$('log').replaceChildren();tell('Attachments are sent once, then retained for follow-ups.');controls()}
async function health(){try{let r=await checked(fetch('/health'));let s=(await r.json()).state;ready=s==='Ready';$('engine').textContent=s;controls();if(!ready&&!s.startsWith('Engine exited'))setTimeout(health,3000)}catch(e){$('engine').textContent=e.message}}
function preview(item){selected=item;let el=document.createElement(item.kind==='image'?'img':item.kind);el.src=item.url;if(item.kind==='image')el.alt=item.name;else{el.controls=true;el.preload='metadata'}$('screen').replaceChildren(el);rack()}
function rack(){$('rack').replaceChildren(...items.map(i=>{let li=document.createElement('li'),b=document.createElement('button'),tag=document.createElement('small');
b.textContent=i.name;b.setAttribute('aria-current',String(i===selected));b.onclick=()=>preview(i);tag.textContent=i.sent?'In conversation':'Next question';li.append(b,tag);
if(!i.sent&&!busy){let x=document.createElement('button');x.textContent=i.enabled?'Exclude':'Include';x.onclick=()=>{i.enabled=!i.enabled;rack()};if(!i.enabled)tag.textContent='Excluded';li.append(x)}return li}))}
async function attach(file,key){if(!sid||busy)return;uploads++;controls();try{let url,r;if(key){r=await checked(fetch('/sample/'+key,{method:'POST',headers:head()}));url='/sample-preview/'+key}else{let f=new FormData();f.set('file',file);r=await checked(fetch('/upload',{method:'POST',headers:head(),body:f}));url=URL.createObjectURL(file)}const item={...await r.json(),url,enabled:true,sent:false};items.push(item);preview(item);tell('Ready for a question.')}catch(e){tell(e.message)}finally{uploads--;controls()}}
$('file').onchange=async e=>{for(const f of e.target.files)await attach(f);$('file').value=''};$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=async e=>{e.preventDefault();for(const f of e.dataTransfer.files)await attach(f)};
for(const b of document.querySelectorAll('[data-ex]'))b.onclick=()=>attach(null,b.dataset.ex);
$('preset').onchange=e=>{if(e.target.value)$('q').value=e.target.value;e.target.value=''};
function timed(node,text){node.replaceChildren();const re=/\b(?:(\d{1,2}):)?(\d{1,3}):([0-5]\d)\b/g;let last=0;for(const m of text.matchAll(re)){node.append(document.createTextNode(text.slice(last,m.index)));let b=document.createElement('button');b.className='stamp';b.textContent=m[0];b.title='Seek selected media';b.onclick=()=>{const v=$('screen').querySelector('video,audio');if(v)v.currentTime=3600*Number(m[1]||0)+60*Number(m[2])+Number(m[3])};node.append(b);last=m.index+m[0].length}node.append(document.createTextNode(text.slice(last)))}
function card(q){const a=document.createElement('section');a.className='reply';const p=document.createElement('p');p.className='question';p.textContent=q;const details=document.createElement('details'),sum=document.createElement('summary'),pre=document.createElement('pre'),body=document.createElement('p');sum.textContent='Thought process';details.append(sum,pre);details.hidden=true;a.append(p,details,body);$('log').prepend(a);return {details,pre,body}}
function split(text,thought){const k=text.indexOf('</think>');if(k>=0)return [thought+text.slice(0,k).replace(/^\s*<think>/,''),text.slice(k+8).trimStart()];if(/^\s*<think>/.test(text))return [thought+text.replace(/^\s*<think>/,''),''];return [thought,text]}
async function ask(){const q=$('q').value.trim();if(!q||busy||!ready||uploads)return;const pending=items.filter(i=>i.enabled&&!i.sent);busy=true;abort=new AbortController();controls();rack();let {details,pre,body}=card(q),text='',thought='',done=false;
try{tell('Reading media…');const r=await checked(fetch('/ask',{method:'POST',headers:{...head(),'Content-Type':'application/json'},signal:abort.signal,body:JSON.stringify({prompt:q,files:pending.map(i=>i.id),thinking:$('think').checked,use_audio:$('sound').checked,fps:+$('fps').value,frames:+$('frames').value,tokens:+$('tokens').value})}));
const reader=r.body.getReader(),dec=new TextDecoder();let buf='';
while(true){const part=await reader.read();if(part.done)break;buf+=dec.decode(part.value,{stream:true});let idx;while((idx=buf.indexOf('\n'))!==-1){const e=JSON.parse(buf.slice(0,idx));buf=buf.slice(idx+1);if(e.error)throw Error(e.error);if(e.done)done=true;text+=e.text||'';thought+=e.thought||''}const [t,b]=split(text,thought);pre.textContent=t;details.hidden=!t;body.textContent=b}
if(!done)throw Error('Reply ended early.');const [t,b]=split(text,thought);timed(body,b);turns.push({q,answer:b,thinking:t});pending.forEach(i=>i.sent=true);$('q').value='';tell('Complete. Select a timestamp to seek the current clip.')}
catch(e){body.classList.add('error');body.append(document.createTextNode('\n'+(e.name==='AbortError'?'Stopped.':e.message)));tell('Turn not added to conversation.')}finally{busy=false;abort=null;controls();rack()}}
$('ask').onclick=ask;$('stop').onclick=()=>abort?.abort();$('new').onclick=()=>start().catch(e=>tell(e.message));
$('q').onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')ask()};
$('save').onclick=()=>{let body=turns.map(t=>'## '+t.q+'\n\n'+t.answer).join('\n\n');if(!body){tell('No completed answers yet.');return}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/markdown'}));a.download='screening-notes.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
start().catch(e=>tell(e.message));health();
</script></html>
