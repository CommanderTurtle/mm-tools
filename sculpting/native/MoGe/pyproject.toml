[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "moge"
version = "3.0.0"
description = "MoGe-3: Fine-Detail Monocular Geometry Estimation with Self-Guided Sparse Volumetric Refinement"
requires-python = ">=3.10"
dependencies = [
  "click>=8.3.1",
  "numpy>=2",
  "opencv-python-headless", # ==4.10.0.84 if any issue with OpenCV
  "scipy>=1.8",
  "pillow",
  "matplotlib",
  "trimesh>=4.11",
  "huggingface-hub",
  "requests",
  "tqdm",
  "torch>=2.4",
  "torchvision>=0.19",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["moge*"]

[tool.setuptools.package-data]
"moge.utils.gradio_3d_viewer" = ["viewer.html", "assets/*.js"]
