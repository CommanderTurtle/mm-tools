<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Voice Isolator</title>
<style>:root{color-scheme:dark;font:16px system-ui;background:#111719;color:#eef6ed}body{max-width:1024px;margin:auto;padding:3vw}header,nav,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}button,input,select{font:inherit;background:#243134;color:inherit;border:1px solid #627673;border-radius:7px;padding:8px}button{cursor:pointer}button[aria-pressed=true],.go{background:#beefb7;color:#152519}.pane,article{margin:12px 0;padding:16px;border-radius:12px;background:#1c2629}canvas{width:100%;height:145px;background:#111819}audio{width:100%}a{color:#bfecbc}output{display:block;padding:8px 0}h2{font-size:1.2rem}section[hidden]{display:none}</style>
<header><h1>Voice Isolator</h1><nav><button id="off" aria-pressed="true">Recording</button><button id="on" aria-pressed="false">Live mic</button></nav></header>
<section class="pane" id="record"><form id="upload" class="row"><label>Audio <input type="file" id="file" accept="audio/*"></label><select id="samples" aria-label="Demo samples"><option value="">Select sample</option></select><button class="go" id="separate">Separate</button></form><p><button id="rec">Record a clip</button> <span id="recstate"></span></p></section>
<section class="pane" id="live" hidden><button class="go" id="start">Start microphone</button> <button id="pause">Pause & listen</button> <button id="stop">Stop</button><p>48 kHz · 20 ms look-ahead · up to 60 seconds</p></section><output id="msg" role="status">Choose a recording.</output>
<label>Audition from same position <select id="solo"><option value="original">Original</option><option value="voice">Voice</option><option value="background">Background</option></select></label><main id="tracks"></main>
<script>
const $=id=>document.getElementById(id),note=m=>$('msg').textContent=m;
const labels={original:'Original',voice:'Isolated voice',background:'Removed background'};
for(const [k,t] of Object.entries(labels)){const a=document.createElement('article');a.innerHTML='<h2>'+t+'</h2><canvas width="800" height="145"></canvas><audio controls></audio><a hidden>Save float WAV</a>';a.id=k;$('tracks').append(a)}
function draw(key,p){if(!p?.spectrogram?.length)return;const c=$(key).querySelector('canvas'),g=c.getContext('2d'),s=p.spectrogram,h=s.length,w=s[0].length;g.fillStyle='#101817';g.fillRect(0,0,c.width,c.height);for(let y=0;y<h;y++){for(let x=0;x<w;x++){const v=s[y][x]/255;g.fillStyle='rgb('+Math.round(15+230*v*v)+','+Math.round(25+188*v)+','+Math.round(36+72*v)+')';g.fillRect(x*800/w,(h-1-y)*105/h,800/w+1,105/h+1)}}g.strokeStyle='#c2efb5';g.beginPath();p.waveform.forEach(([lo,hi],i)=>{const x=i*800/p.waveform.length;g.moveTo(x,125-18*hi);g.lineTo(x,125-18*lo+1)});g.stroke()}
let lastPlayer;document.addEventListener('play',e=>{if(e.target.tagName!=='AUDIO')return;for(const a of document.querySelectorAll('audio'))if(a!==e.target)a.pause();lastPlayer=e.target;$('solo').value=e.target.parentElement.id},true);$('solo').onchange=()=>{const a=$($('solo').value).querySelector('audio');if(!a.src)return;const t=lastPlayer?.currentTime||0,p=lastPlayer&&!lastPlayer.paused;lastPlayer?.pause();a.currentTime=t;lastPlayer=a;if(p)a.play().catch(()=>{})};
let epoch=0,preparing=false;let playAfter=false,socket,device,ctx,src,proc,stream,buffered=0,rec,clip,recordStream,recordTimer;
function results(r){for(const k of Object.keys(labels)){const url='/audio/'+r.token+'/'+k;$(k).querySelector('audio').src=url+'.wav';let a=$(k).querySelector('a');a.href=url+'-float.wav';a.download=k+'.wav';a.hidden=false;draw(k,r.plots[k])}note(r.duration.toFixed(1)+' s'+(r.device?' · '+r.device+' · '+r.seconds.toFixed(2)+' s processing':''));if(playAfter){playAfter=false;$('voice').querySelector('audio').play().catch(()=>{})}}
fetch('/samples').then(r=>r.json()).then(a=>a.forEach(s=>$('samples').add(new Option(s,s))));
$('file').onchange=()=>{clip=null;$('samples').value=''};$('samples').onchange=()=>{clip=null;$('file').value=''};
function tracksOff(s){s?.getTracks().forEach(t=>t.stop())}
function stopRecord(){if(rec?.state==='recording')rec.stop()}
$('rec').onclick=async()=>{if(rec?.state==='recording'){stopRecord();return}try{const gen=epoch;$('separate').disabled=true;$('rec').disabled=true;recordStream=await navigator.mediaDevices.getUserMedia({audio:true});if(gen!==epoch){tracksOff(recordStream);$('separate').disabled=$('rec').disabled=false;return}$('rec').disabled=false;rec=new MediaRecorder(recordStream);const chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{clearTimeout(recordTimer);tracksOff(recordStream);$('rec').textContent='Record a clip';const ac=new AudioContext();try{const b=await ac.decodeAudioData(await new Blob(chunks).arrayBuffer()),n=b.length,buf=new ArrayBuffer(44+n*2),v=new DataView(buf),text=(at,s)=>Array.from(s).forEach((c,i)=>v.setUint8(at+i,c.charCodeAt(0)));text(0,'RIFF');v.setUint32(4,36+n*2,true);text(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,b.sampleRate,true);v.setUint32(28,b.sampleRate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);text(36,'data');v.setUint32(40,2*n,true);let channels=Array.from({length:b.numberOfChannels},(_,i)=>b.getChannelData(i));for(let i=0;i<n;i++){let y=channels.reduce((a,c)=>a+c[i],0)/channels.length;v.setInt16(44+2*i,Math.round(Math.min(1,Math.max(-1,y))*32767),true)}clip=new File([buf],'recording.wav',{type:'audio/wav'});$('file').value='';$('samples').value='';$('recstate').textContent=b.duration.toFixed(1)+' s recorded'}catch(e){note(e.message)}finally{ac.close();$('separate').disabled=false}};rec.start();recordTimer=setTimeout(stopRecord,60000);$('rec').textContent='Finish recording'}catch(e){$('separate').disabled=$('rec').disabled=false;tracksOff(recordStream);note(e.message)}};
$('upload').onsubmit=async e=>{e.preventDefault();if($('separate').disabled)return;const f=new FormData(),a=clip||$('file').files[0];if(a)f.append('file',a);else f.append('sample',$('samples').value);note('Separating…');try{const r=await fetch('/isolate',{method:'POST',body:f}),data=await r.json();if(!r.ok)throw Error(data.detail);results(data)}catch(err){note(err.message)}};
async function release(){tracksOff(stream);proc?.disconnect();src?.disconnect();if(ctx&&ctx.state!=='closed')await ctx.close();ctx=src=proc=stream=null}
function finish(play=false){epoch++;playAfter=play;if(socket?.readyState===0){tracksOff(stream);socket.close();return}if(proc){proc.port.postMessage('stop')}else if(socket?.readyState===1)socket.send('stop')}
$('stop').onclick=()=>finish();$('pause').onclick=()=>finish(true);
$('start').onclick=async()=>{if(socket||preparing)return;preparing=true;const gen=++epoch;document.querySelectorAll('audio').forEach(a=>a.pause());$('start').disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});if(gen!==epoch)throw Error('Capture cancelled.');ctx=new AudioContext();await ctx.audioWorklet.addModule('/capture.js');await ctx.resume();if(gen!==epoch)throw Error('Capture cancelled.');src=ctx.createMediaStreamSource(stream);proc=new AudioWorkletNode(ctx,'capture');buffered=0;const s=socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/live');s.onopen=()=>{if(gen!==epoch){tracksOff(stream);s.close();return}s.send(String(ctx.sampleRate));note('Preparing realtime model…')};s.onmessage=e=>{const m=JSON.parse(e.data);if(m.ready){if(gen!==epoch){tracksOff(stream);s.close();return}device=m.device;src.connect(proc);const silent=ctx.createGain();silent.gain.value=0;proc.connect(silent).connect(ctx.destination);note('Listening · '+device)}if(m.view){buffered=Math.max(0,buffered-1);draw('original',m.view.input);draw('voice',m.view.output);note(m.seconds.toFixed(1)+' s · '+device+' · '+(m.seconds/Math.max(.001,m.compute)).toFixed(1)+'× realtime')}if(m.result)results(m.result);if(m.error)note(m.error)};s.onclose=async()=>{await release();socket=null;$('start').disabled=false};s.onerror=()=>note('Live connection unavailable.');proc.port.onmessage=e=>{if(s.readyState!==1)return;if(!e.data){s.send('stop');tracksOff(stream);return}if(buffered>=20){finish();note('Capture paused: processing fell behind.');return}buffered++;s.send(e.data.buffer)}}catch(err){await release();if(socket)socket.close();socket=null;$('start').disabled=false;note(err.message)}finally{preparing=false}};
function mode(live){epoch++;if(!live&&socket)finish();if(live)stopRecord();$('record').hidden=live;$('live').hidden=!live;$('on').setAttribute('aria-pressed',live);$('off').setAttribute('aria-pressed',!live)}
$('off').onclick=()=>mode(false);$('on').onclick=()=>mode(true);document.addEventListener('play',()=>{stopRecord();if(socket)finish()},true);onpagehide=()=>{epoch++;tracksOff(stream);tracksOff(recordStream);socket?.close()};
</script></html>
