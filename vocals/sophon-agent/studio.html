<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sophon</title><style>:root{color-scheme:dark;font:16px system-ui;background:#0c1618;color:#e8f4f1}body{max-width:1000px;margin:auto;padding:3vw}header,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{justify-content:space-between}section,details{background:#172428;border:1px solid #304348;border-radius:14px;padding:18px;margin:14px 0}button,input,select{font:inherit;background:#23353a;color:inherit;border:1px solid #45656a;border-radius:7px;padding:7px}button{cursor:pointer}.go{background:#9ce7cb;color:#102a26}canvas{width:100%;height:125px;background:#0b1517;border-radius:6px}p{white-space:pre-wrap}output{color:#a2f1da}video{max-width:200px}small{color:#b1c8c6}</style>
<header><h1>Sophon</h1><output id="state">Starting engine…</output></header><small>Community NVFP4 Flash thinker · Tag voice stack (experimental pairing)</small><section><div class="row"><label>Voice <select id="voice"></select></label><label>Language <select id="lang"><option value="en">English</option><option value="zh">中文</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option><option value="pt">Português</option></select></label><button id="call" disabled class="go">Start call</button><button id="end">End</button><button id="camera">Camera off</button></div>
<p><small>Mic · Sophon</small></p><canvas id="scope" width="920" height="125"></canvas><video id="cam" muted playsinline hidden></video><output id="status" aria-live="polite"></output><div id="words"></div></section>
<section><label>Recorded question <input id="file" type="file" accept="audio/*"></label> <button id="ask" disabled>Send recording</button><p id="answer"></p><audio id="reply" controls></audio> <a id="save" hidden download="sophon.wav">Save reply</a></section>
<details><summary>Reference voice</summary><p>Use 3–10 seconds of one speaker you have permission to use.</p><input aria-label="Voice name" id="name" placeholder="voice-name"><input type="file" id="ref" accept=".wav,.flac"><button id="add">Add voice</button></details>
<script>
const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;
let ready=false,busy=false,calling=false;function controls(){$('call').disabled=!ready||calling||busy;$('ask').disabled=!ready||calling||busy;$('end').disabled=!calling;$('voice').disabled=$('lang').disabled=calling||busy}async function refresh(){try{const j=await(await fetch('/state')).json();$('state').textContent=j.state;ready=j.state==='ready';controls();if(j.voices.join()!==Array.from($('voice').options).map(o=>o.value).join()){const prev=$('voice').value;$('voice').replaceChildren(...j.voices.map(x=>new Option(x,x)));$('voice').value=j.voices.includes(prev)?prev:j.voices.includes('chelsie_en')?'chelsie_en':j.voices[0]}if(j.state==='starting')setTimeout(refresh,2000)}catch{status('Studio disconnected')}}refresh();
let ws,ac,mic,cam,node,next=0,raf,epoch=0,playing=new Set(),line,picture=0,download,abort;
const trace=[[],[]],graph=$('scope').getContext('2d'),photo=document.createElement('canvas');photo.width=384;photo.height=216;
function peak(data,lane){let v=0;for(let i=0;i<data.length;i+=16)v=Math.max(v,Math.abs(data[i]));trace[lane].push(v);if(trace[lane].length>210)trace[lane].shift();graph.clearRect(0,0,920,125);trace.forEach((a,k)=>{graph.strokeStyle=k?'#5edab1':'#91aeff';graph.beginPath();a.forEach((p,i)=>{const x=920-(a.length-i)*4,y=31+k*62;graph.moveTo(x,y-1-p*27);graph.lineTo(x,y+1+p*27)});graph.stroke()})}
function interrupt(){for(const s of playing){try{s.stop()}catch{}}playing.clear();next=0}
function end(reason='Call ended'){calling=false;epoch++;if(ws){const s=ws;ws=null;if(s.readyState===1)s.send(JSON.stringify({type:'session.close'}));s.close()}interrupt();mic?.getTracks().forEach(t=>t.stop());cam?.getTracks().forEach(t=>t.stop());mic=cam=null;node?.disconnect();node=null;if(ac)ac.close();ac=null;$('cam').hidden=true;$('camera').textContent='Camera off';controls();line=null;status(reason)}
function from64(s){return Uint8Array.from(atob(s),x=>x.charCodeAt(0))}function b64(data){let s='';for(const b of data)s+=String.fromCharCode(b);return btoa(s)}
function pcm(data){const a=new Int16Array(data.buffer,data.byteOffset,data.byteLength>>1),b=ac.createBuffer(1,a.length,24000),v=b.getChannelData(0);for(let i=0;i<a.length;i++)v[i]=a[i]/32768;peak(v,1);const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);next=Math.max(ac.currentTime+.012,next);s.start(next);next+=b.duration;playing.add(s);s.onended=()=>playing.delete(s)}
$('call').onclick=async()=>{end();const id=epoch;calling=true;controls();let terminal='Call ended';try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true}});if(id!==epoch){s.getTracks().forEach(t=>t.stop());return}mic=s;ac=new AudioContext({sampleRate:16000});await ac.audioWorklet.addModule('/mic.js');if(id!==epoch)return;await ac.resume();if(id!==epoch)return;
const socket=ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/call');const input=ac.createMediaStreamSource(mic);node=new AudioWorkletNode(ac,'sophon-mic');const mute=ac.createGain();mute.gain.value=0;node.connect(mute).connect(ac.destination);socket.onopen=()=>{if(id!==epoch)return;socket.send(JSON.stringify({type:'session.update',session:{voice:$('voice').value,modalities:['audio','text'],input_audio_format:'pcm_f32le',output_audio_format:'pcm16',turn_detection:{type:'server_vad'},extra_body:{language:$('lang').value,auto_response:true}}}));input.connect(node);status('Listening')};node.port.onmessage=e=>{if(socket.readyState!==1||id!==epoch)return;if(socket.bufferedAmount>2e6){end();status('Connection fell behind');return}const v=e.data;peak(v,0);const m={type:'input_audio_buffer.append',sample_rate_hz:16000,format:'pcm_f32le',audio:b64(new Uint8Array(v.buffer))};if(cam&&$('cam').readyState>=2&&performance.now()-picture>1000){photo.getContext('2d').drawImage($('cam'),0,0,384,216);m.video_frames=[photo.toDataURL('image/jpeg',.65).split(',')[1]];picture=performance.now()}socket.send(JSON.stringify(m))};
socket.onmessage=e=>{if(id!==epoch)return;const m=JSON.parse(e.data),t=m.type;if(t==='response.audio.delta'||t==='response.output_audio.delta')pcm(from64(m.delta));else if(t==='input_audio_buffer.speech_started'||t==='output_audio_buffer.cleared'){interrupt();status('Listening');line=null}else if(t==='response.created'){line=null;status('Sophon speaking')}else if(/response\.(audio_transcript|output_audio_transcript|output_text|text)\.delta$/.test(t)){if(!line){line=document.createElement('p');$('words').append(line)}line.textContent+=m.delta}else if(t==='conversation.item.input_audio_transcription.completed'){const p=document.createElement('p');p.textContent='You · '+m.transcript;$('words').append(p)}else if(t==='response.done'){if(m.response?.status==='cancelled')interrupt();line=null;status('Listening')}else if(t==='error'){terminal=m.error?.message||m.message||'Call error';status(terminal)}};socket.onerror=()=>{terminal='Engine connection failed'};socket.onclose=e=>{if(id===epoch)end(e.reason||terminal)}}catch(e){if(id===epoch){end();status(e.message)}}};
$('end').onclick=()=>end();$('camera').onclick=async()=>{if(!ws){status('Start a call first');return}if(cam){cam.getTracks().forEach(t=>t.stop());cam=null;$('cam').hidden=true;$('camera').textContent='Camera off';return}try{const id=epoch,s=await navigator.mediaDevices.getUserMedia({video:true});if(id!==epoch){s.getTracks().forEach(t=>t.stop());return}cam=s;$('cam').srcObject=s;$('cam').hidden=false;await $('cam').play();$('camera').textContent='Camera on'}catch(e){status(e.message)}};
function wav(blocks,rate){const n=blocks.reduce((n,x)=>n+x.length,0),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);function tag(i,s){for(const c of s)v.setUint8(i++,c.charCodeAt())}tag(0,'RIFF');v.setUint32(4,36+n*2,true);tag(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);tag(36,'data');v.setUint32(40,n*2,true);let i=44;for(const x of blocks)for(const y of x){v.setInt16(i,Math.max(-32768,Math.min(32767,y*32768)),true);i+=2}return new Blob([buf],{type:'audio/wav'})}
$('ask').onclick=async()=>{const f=$('file').files[0];if(!f)return;const form=new FormData();form.append('file',f);form.append('language',$('lang').value);form.append('voice',$('voice').value);busy=true;controls();$('answer').textContent='';$('save').hidden=true;$('reply').removeAttribute('src');$('reply').load();let playAt=0;const dc=new AudioContext({sampleRate:24000}),blocks=[];abort=new AbortController();try{await dc.resume();const r=await fetch('/recording',{method:'POST',body:form,signal:abort.signal});if(!r.ok)throw Error(await r.text());const reader=r.body.pipeThrough(new TextDecoderStream()).getReader();let pending='';while(true){const {done,value}=await reader.read();if(done)break;pending+=value;const lines=pending.split('\n');pending=lines.pop();for(const l of lines){if(!l||l==='[DONE]')continue;const j=JSON.parse(l);for(const c of j.choices||[]){const x=c.delta?.content;if(!x)continue;if(j.modality==='audio'){const b=await dc.decodeAudioData(from64(x).buffer);blocks.push(b.getChannelData(0).slice());const src=dc.createBufferSource();src.buffer=b;src.connect(dc.destination);playAt=Math.max(playAt,dc.currentTime+.02);src.start(playAt);playAt+=b.duration}else $('answer').textContent+=x}}}if(blocks.length){if(download)URL.revokeObjectURL(download);download=URL.createObjectURL(wav(blocks,dc.sampleRate));$('reply').src=$('save').href=download;$('save').hidden=false}}catch(e){status(e.message)}finally{setTimeout(()=>dc.close(),Math.max(0,(playAt-dc.currentTime)*1000)+100);busy=false;controls()}};
$('add').onclick=async()=>{const f=$('ref').files[0];if(!f)return;const form=new FormData();form.append('name',$('name').value);form.append('file',f);const r=await fetch('/voice',{method:'POST',body:form});status(r.ok?'Voice added':await r.text());if(r.ok)refresh()};onpagehide=()=>{end();abort?.abort()};
</script></html>
