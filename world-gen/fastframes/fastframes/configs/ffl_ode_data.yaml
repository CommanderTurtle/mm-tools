# FastFrames-L stage 0: ODE trajectories of the bidirectional Wan2.1-T2V-14B teacher.
#   torchrun --nproc_per_node 8 scripts/train.py --config configs/ffl_ode_data.yaml
# The FF-L corpus holds 167,936 prompts (2,624 shards); each stored latent is ~4.2 MB.
stage: ode_data
model:
  name: Wan2.1-T2V-14B          # teacher (and its T5 encoder); Wan2.1-T2V-1.3B for the small variant
  checkpoint_root: checkpoints  # holds <name>/
  cross_attention: auto          # PyTorch picks the text cross-attention kernel
data:
  prompts: data/prompts/<name>.txt   # one prompt per line; line i becomes sample i
  num_samples: null                   # null: every prompt
generation:
  steps: 48                     # Euler steps of the shifted flow schedule
  shift: 5.0
  guidance_scale: 5.0           # classifier-free guidance, applied to the x0 predictions
  # The unconditional branch uses Wan2.1's default negative prompt.
  negative_prompt: 色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走
  seed: 20260731                # sample i starts from noise seeded with seed + i
  stored_steps: [48]            # final clean latent used by later stages
  latent_shape: [21, 16, 60, 104]     # 81 frames at 480x832
  shard_size: 64
output_dir: outputs/ffl_ode_data
