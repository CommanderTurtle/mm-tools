# FastFrames-L stage 3: self-forcing DMD of the 2-step frame-causal generator.
# The KV-refinement stage (ffl_kv_refinement.yaml) starts from the EMA export after 1500 critic
# (= 150 generator) updates.
# Recipe: 128 GPUs (16 nodes x 8), one prompt per GPU, i.e. a global batch of 128.
#   torchrun --nnodes 16 --nproc_per_node 8 ... scripts/train.py --config configs/ffl_dmd.yaml
stage: dmd
seed: 20260731                  # per-rank noise (seed + rank) and the balanced exit schedule
model:
  name: Wan2.1-T2V-14B          # generator architecture and T5 encoder of <checkpoint_root>/<name>
  checkpoint_root: checkpoints
  cross_attention: auto          # PyTorch picks the text cross-attention kernel
  init: outputs/ffl_consistency/exports/step_00003000/model.safetensors   # raw (non-EMA) consistency student
  real_score: Wan2.1-T2V-14B    # frozen bidirectional teacher
  fake_score: Wan2.1-T2V-14B    # critic, initialised from the same bidirectional weights
data:
  prompts: data/prompts/vidprom_filtered_extended.txt
  seed: 20260731                # prompt order
rollout:
  latent_shape: [21, 16, 60, 104]           # 81 frames at 480x832
  # Nominal steps [1000, 500] (frame 0: [1000, 750, 500, 250]) on the shift-5 grid, truncated to integers.
  timesteps: [1000, 833]
  first_frame_timesteps: [1000, 937, 833, 625]
train:
  max_critic_updates: 3990
  critic_updates_per_generator: 10
  initial_critic_updates: 10    # generator updates follow critic updates 10, 20, ..., 3990, on their prompts
  shift: 5.0
  guidance_scale: 3.0           # real score CFG against the negative prompt
  fake_guidance_scale: 0.0
  score_timestep_range: [20, 980]
  negative_prompt: 色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走
  sharding: full
  save_every: 300               # resumable checkpoint (generator, critic, Adam, EMA, data position, RNG)
  keep_checkpoints: 2
  export_every: 500             # BF16 raw model.safetensors + EMA ema.safetensors
optimizer:
  generator_lr: 2.0e-6
  critic_lr: 4.0e-7
  betas: [0.0, 0.999]
  weight_decay: 0.0
  max_grad_norm: 10.0
  ema_decay: 0.99
  ema_start: 39                 # generator update 39 (critic update 390); blends from the initial weights
  ema_copy_on_start: false
output_dir: outputs/ffl_dmd
wandb:
  project: null                 # set to log to Weights & Biases
