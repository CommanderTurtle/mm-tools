<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FastFrames</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#111619;color:#edf4f0}body{max-width:1120px;margin:auto;padding:3vw}h1{font-weight:520;letter-spacing:-.06em;font-size:clamp(32px,5vw,64px);margin:12px 0}header,nav,.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:20px}aside,figure{margin:0;padding:18px;background:#1a2227;border-radius:14px}canvas,video{width:100%;aspect-ratio:832/464;background:#0a1013;object-fit:contain;border-radius:9px}button,input,select,textarea{font:inherit;color:inherit;background:#253138;border:1px solid #435159;border-radius:.5em;padding:.5em}label{display:grid;gap:5px;margin:12px 0;color:#bfd0ca}textarea{resize:vertical}button{cursor:pointer}button[aria-pressed=true],.go{background:#b6ebac;color:#122616}output{display:block;margin:12px 0;color:#baedb0}small{color:#acc0bd}.key{touch-action:none}.key:active,.key.down{background:#aedea2;color:#142416}a{color:#c6e9aa}[hidden]{display:none!important}@media(max-width:720px){.layout{grid-template-columns:1fr}} </style>
<header><h1>FastFrames</h1><nav><button id="world" aria-pressed="true">Live world</button><button id="clip" aria-pressed="false">Generate clip</button></nav></header>
<div class="layout"><figure><canvas id="screen" width="832" height="464" aria-label="Live frames"></canvas><video id="movie" controls hidden></video><output id="status" aria-live="polite">Choose a scene or upload a starting image.</output><div id="keys" class="tools"></div><a id="download" hidden download="fastframes.mp4">Download MP4</a></figure>
<aside><section id="sources"><label>Scene<select id="scenes"><option value="">Your image</option></select></label><label>Start image<input id="image" type="file" accept="image/jpeg,image/webp,image/png"></label></section>
<label>Prompt<textarea id="prompt" rows="4" maxlength="1600"></textarea></label><label>Seed<input id="seed" type="number" min="0" max="4294967295" value="42"></label>
<section id="duration" hidden><label>Prompt examples<select id="ideas"><option>Custom prompt</option></select></label><label><span><input type="checkbox" id="ab"> Director’s A/B · render two takes</span></label><label>Take B seed<input id="seedB" type="number" min="0" max="4294967295" value="43"></label><label>Length<select id="seconds"><option>2</option><option>3</option><option>4</option><option selected>5</option></select></label><label><span><input id="random" type="checkbox" checked> Randomize seed</span></label></section>
<div class="tools"><button class="go" id="start">Start world</button><button id="stop">Stop</button><button id="join" hidden>Join queue</button></div><small id="hint">WASD moves · ← → pans. Cold starts include compilation.</small></aside></div><section id="takes" class="tools" aria-label="Director’s takes"></section><details><summary>Session clips</summary><div id="history"></div><button id="clearHistory">Clear history</button></details>
<script>
'use strict';const $=id=>document.getElementById(id),say=s=>$('status').textContent=s;
const ctx=$('screen').getContext('2d'),map={w:'forward',s:'backward',a:'left',d:'right',ArrowLeft:'yaw_left',ArrowRight:'yaw_right'};
let frozenB,queueB=false,takeURLs=[],seq=0; let mode='world',ws=null,rooms=[],worldInput=null,chunk,ready=false,movieURL,held=null,pending=null,sending=false;
function send(data){if(ws?.readyState===1)ws.send(JSON.stringify(data))}
function act(k){if(!ready||!map[k])return;pending=k;flush()}
function flush(){if(pending&&!sending&&ready){const k=pending;pending=null;sending=true;send({type:'action',request_id:crypto.randomUUID(),action:map[k]})}}
let past=[];function drawHistory(){$('history').replaceChildren();for(const h of past){const b=document.createElement('button'),a=document.createElement('a');b.textContent='Reuse · '+h.seed+' · '+h.seconds+' s';b.onclick=()=>{choose('clip');$('prompt').value=h.prompt;$('seconds').value=h.seconds;$('seed').value=h.seed;$('random').checked=false;$('movie').src=$('download').href=h.url;$('movie').hidden=$('download').hidden=false;$('screen').hidden=true};a.href=h.url;a.download='fastframes-'+h.seed+'.mp4';a.textContent='Save';$('history').append(b,a)}}$('clearHistory').onclick=()=>{for(const h of past)URL.revokeObjectURL(h.url);past=[];drawHistory()};
const buttons={};for(const [k,v] of Object.entries(map)){const b=document.createElement('button');b.textContent=k.replace('ArrowLeft','←').replace('ArrowRight','→').toUpperCase();b.title=v;b.className='key';b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);held=k;act(k)};b.onpointerup=b.onpointercancel=()=>{held=null};$('keys').append(b);buttons[k]=b}
onkeydown=e=>{if(mode!=='world'||!map[e.key]||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;e.preventDefault();if(!e.repeat){held=e.key;buttons[held].classList.add('down');act(held)}};
onkeyup=e=>{buttons[e.key]?.classList.remove('down');if(held===e.key)held=null};
onblur=()=>{held=null;pending=null;Object.values(buttons).forEach(b=>b.classList.remove('down'))};
function close(){seq++;queueB=false;if(ws){ws.close();ws=null}held=pending=null;ready=sending=false;$('join').dataset.wait='';$('join').hidden=true}
function resetMedia(){if(movieURL){URL.revokeObjectURL(movieURL);movieURL=null}$('movie').removeAttribute('src');$('movie').hidden=$('download').hidden=true;$('screen').hidden=false}
function choose(m){close();resetMedia();mode=m;const live=m==='world';$('prompt').maxLength=live?1600:2000;$('screen').height=live?464:480;$('screen').style.aspectRatio=live?'832/464':'832/480';$('world').setAttribute('aria-pressed',live);$('clip').setAttribute('aria-pressed',!live);$('sources').hidden=$('keys').hidden=!live;$('duration').hidden=live;$('start').textContent=live?'Start world':'Generate';$('hint').textContent=live?'WASD moves · ← → pans. Cold starts include compilation.':'FastFrames-L · 16 fps · 832 × 480';say('Ready')}
const samples={'Moon garden':'A tiny astronaut tending a glowing garden inside a glass greenhouse on the moon, stars visible through the windows.','Coastal aerial':'Aerial view of turquoise waves breaking over a black-sand beach at sunrise, sea mist drifting across the shoreline.','Paper dragon':'A red paper dragon flying through a lantern-lit night market, ribbons fluttering, lively and richly detailed.','After the rain':'Macro shot of raindrops falling onto a blue flower, petals trembling, shallow depth of field, soft morning light.'};for(const [k,p] of Object.entries(samples))$('ideas').add(new Option(k,p));$('ideas').onchange=()=>{if($('ideas').selectedIndex)$('prompt').value=$('ideas').value};
$('world').onclick=()=>choose('world');$('clip').onclick=()=>choose('clip');$('stop').onclick=()=>{close();say('Stopped')};$('join').onclick=()=>send({type:'join_queue'});
function paint(img){ctx.drawImage(img,0,0,$('screen').width,$('screen').height)}
async function select(ref){let img=new Image();img.src=ref;await img.decode();paint(img)}
fetch('/api/examples').then(r=>r.json()).then(a=>{rooms=a;for(const r of a)$('scenes').add(new Option(r.label,r.id));if(a.length){$('scenes').value=a[0].id;$('scenes').onchange()}});
$('scenes').onchange=()=>{const r=rooms.find(r=>r.id===$('scenes').value);if(r){worldInput=null;$('image').value='';$('prompt').value=r.prompt;select(r.image_url)}};
$('image').onchange=()=>{let f=$('image').files[0];if(!f)return;if(f.size>8388608){say('Choose an image smaller than 8 MiB.');return}let reader=new FileReader();reader.onload=()=>{worldInput=reader.result;$('scenes').value='';select(worldInput)};reader.readAsDataURL(f)};
$('start').onclick=()=>start(false);function start(second){if(!second){takeURLs.forEach(URL.revokeObjectURL);takeURLs=[];$('takes').replaceChildren()}if(!second&&!$('prompt').value.trim()){say('Enter a prompt.');return}if(!second&&mode==='world'&&!worldInput&&!$('scenes').value){say('Choose an image.');return}close();resetMedia();const live=mode==='world',s=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+(live?'/ws':'/generate'));ws=s;s.binaryType='arraybuffer';let meta;const recipe=second?frozenB:{prompt:$('prompt').value,seconds:Number($('seconds').value)};if(!second)frozenB={...recipe,seed:Number($('seedB').value)};const launch=()=>send({type:'start',example:$('scenes').value,image:worldInput,prompt:$('prompt').value,seed:Number($('seed').value)});
s.onopen=()=>{if(ws!==s)return;say('Preparing…');if(live)launch();else{const pair=!second&&$('ab').checked;s.datasetPair=pair;if(!second&&$('random').checked)$('seed').value=crypto.getRandomValues(new Uint32Array(1))[0];send({...recipe,seed:second?recipe.seed:Number($('seed').value)})}};
s.onerror=()=>{if(s===ws)say('Connection failed.')};s.onclose=()=>{messages.then(()=>{if(s===ws){ws=null;ready=false;if(queueB){start(true);return}if(!movieURL&&$('status').textContent==='Preparing…')say('Session ended.')}})};
let messages=Promise.resolve(),id=seq;s.onmessage=e=>{messages=messages.then(()=>receive(e))};async function receive(e){if(id!==seq)return;try{if(typeof e.data==='string'){const m=JSON.parse(e.data);
if(m.type==='chunk'||m.type==='preview'||m.type==='movie')meta=m;
else if(m.type==='error'){queueB=false;say(m.message)}
else if(m.type==='queue_state'){$('join').hidden=m.status!=='busy';if(m.status==='queued')say('Queue position '+m.position);if(m.status==='owner'&&$('join').dataset.wait==='1'){$('join').dataset.wait='';launch()}}
else if(m.type==='status'){ready=m.state==='ready';say(m.message);if(ready){sending=false;flush()}}
return}const m=meta;meta=null;if(!m)return;
if(m.type==='movie'){queueB=!!s.datasetPair;past.unshift({...recipe,seed:m.seed,url:URL.createObjectURL(new Blob([e.data],{type:'video/mp4'}))});if(past.length>8)URL.revokeObjectURL(past.pop().url);drawHistory();movieURL=URL.createObjectURL(new Blob([e.data],{type:'video/mp4'}));$('movie').src=$('download').href=movieURL;$('movie').hidden=$('download').hidden=false;$('screen').hidden=true;if(second||s.datasetPair){const u=URL.createObjectURL(new Blob([e.data],{type:'video/mp4'}));takeURLs.push(u);const card=document.createElement('figure'),v=document.createElement('video'),a=document.createElement('a');v.src=a.href=u;v.controls=true;v.style.maxWidth='390px';a.download='take-'+m.seed+'.mp4';a.textContent=(second?'Take B':'Take A')+' · seed '+m.seed;card.append(v,a);$('takes').append(card)}say('Complete · seed '+m.seed);return}
if(m.type==='preview'){const view=new DataView(e.data);for(let at=0;at<view.byteLength;){const len=view.getUint32(at);at+=4;const img=await createImageBitmap(new Blob([e.data.slice(at,at+len)],{type:'image/jpeg'}));at+=len;if(id!==seq){img.close();return}paint(img);img.close();await new Promise(r=>setTimeout(r,62.5))}return}
let offset=0;for(const size of m.frame_sizes||[e.data.byteLength]){const img=await createImageBitmap(new Blob([e.data.slice(offset,offset+size)],{type:'image/jpeg'}));if(s!==ws){img.close();return}paint(img);img.close();offset+=size;if(m.type==='chunk')await new Promise(r=>setTimeout(r,20))}
if(m.type==='chunk'&&s===ws){send({type:'displayed',chunk_index:m.chunk_index});if(held)pending=held;say('Block '+(m.chunk_index+1)+' · '+Math.round(m.model_ms)+' ms')}else say('Generating · seed '+$('seed').value)
}catch(err){say(err.message);close()}}}
$('join').onclick=()=>{$('join').dataset.wait='1';send({type:'join_queue'})};onpagehide=close;
</script></html>
